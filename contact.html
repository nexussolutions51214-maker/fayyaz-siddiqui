<!DOCTYPE html>

  <title>Contact | Fayyaz Siddiqui</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: #f8fafc; }
    .container { max-width: 1000px; margin: 0 auto; padding: 32px 24px 60px; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; }
    .card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 18px; padding: 24px; margin-top: 18px; }
    form { display: grid; gap: 12px; }
    input, textarea { padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #111827; color: white; }
    button { padding: 12px 16px; border: 0; border-radius: 10px; background: #2563eb; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <strong>Fayyaz Siddiqui</strong>
      <div>
        <a href="index.html">Home</a>
        <a href="team.html">About</a>
        <a href="index3.html">Services</a>
      </div>
    </nav>

    <div class="card">
      <h1>Let’s discuss your next project.</h1>
      <p>I am available for freelance work, business websites, WordPress projects, and front-end development assignments. With 2.5+ years of experience, I can help turn your ideas into professional digital solutions.</p>
    </div>

    <div class="card">
      <h2>Contact Form</h2>
      <form>
        <input type="text" placeholder="Your Name" />
        <input type="email" placeholder="Your Email" />
        <input type="text" placeholder="Project Type" />
        <textarea rows="5" placeholder="Tell me about your project"></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </div>
